name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Clippy WASM
        run: cargo clippy --locked --target wasm32-unknown-unknown --features wasm -- -D warnings
      - name: Test
        # Release profile: CI perft depths (docs/perft-table.md) are heavy in debug.
        run: cargo test --locked --release
      - name: Install wasm-pack
        # Pin version so CI does not float on the installer's latest binary.
        run: cargo install wasm-pack --version 0.13.1 --locked --force
      - name: Build WASM (nodejs)
        run: wasm-pack build --target nodejs --out-dir pkg -- --features wasm
      - name: Node WASM legalMoves
        run: node --test tests/wasm/legal_moves.test.mjs
      - name: Verify README
        run: node scripts/verify-readme.mjs
