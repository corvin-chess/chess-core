[package]
name = "corvin-chess-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "AGPL-3.0-or-later"
description = "Corvin chess rules library: board representation, move generation, notation, and draw helpers"
repository = "https://github.com/corvin-chess/chess-core"
readme = "README.md"
keywords = ["chess", "rules", "bitboard"]
categories = ["games"]
publish = false

[lib]
name = "corvin_chess_core"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Browser/Node bindings via wasm-bindgen (build with wasm-pack --features wasm).
wasm = ["dep:wasm-bindgen"]

[dependencies]
wasm-bindgen = { version = "0.2", optional = true }
